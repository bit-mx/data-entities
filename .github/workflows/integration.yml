name: integration
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    name: MySQL integration

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: data_entities
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATA_ENTITIES_INTEGRATION_MYSQL: 1
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: data_entities
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_ENTITIES_DRIVER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Running MySQL integration tests
        run: vendor/bin/pest --compact tests/Integration
