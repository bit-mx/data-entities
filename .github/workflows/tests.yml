name: tests
on:
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5]
        laravel: [11, 12, 13]
        include:
          - laravel: 11
            testbench: ^9.0
          - laravel: 12
            testbench: ^10.0
          - laravel: 13
            testbench: ^11.0

    name: P${{ matrix.php }} L${{ matrix.laravel }}

    env:
      CACHE_ENTITIES_DRIVER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist --optimize-autoloader --with-all-dependencies
      - name: Running tests
        run: vendor/bin/pest
