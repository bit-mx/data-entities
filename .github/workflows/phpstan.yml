name: phpstan
on:
  pull_request:
    branches:
      - master
jobs:

  phpstan:
    name: phpstan

    strategy:
      fail-fast: true
      matrix:
        php: [ 8.4, 8.5 ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: .phpstan-cache
          key: phpstan-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock', 'phpstan.dist.neon', 'phpstan-baseline.neon', 'src/**/*.php') }}
          restore-keys: |
            phpstan-${{ runner.os }}-php-${{ matrix.php }}-
      - name: Run phpstan
        run: vendor/bin/phpstan analyse -c phpstan.dist.neon --memory-limit=1G --error-format=github
